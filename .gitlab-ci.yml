# Open-source gate and GitHub publish come from the shared CI project.
# Every branch is checked; a branch that passes is pushed to the private GitHub repository.
include:
  - project: 'kino_lian/oss-shared-ci'
    file: '/oss-release.yml'
    ref: main
  - project: 'kino_lian/oss-shared-ci'
    file: '/oss-sbom.yml'
    ref: main

# Must list every stage: a project-level stages key replaces the included ones.
stages:
  - test
  - sbom
  - security_check
  - push_to_github

pytest:
  stage: test
  image: python:3.12-slim
  variables:
    PYTHONPATH: src
  before_script:
    - pip install --no-cache-dir -r requirements-test.txt
  script:
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
